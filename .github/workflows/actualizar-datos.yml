name: Actualizar datos

# Se ejecuta cada día a las 14:30 UTC (los precios de mañana ya están publicados)
# y también a mano: pestaña Actions > Actualizar datos > Run workflow.
on:
  schedule:
    - cron: "30 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pandas requests

      - name: Descargar precios de Red Eléctrica
        run: python actualizar_datos.py

      - name: Guardar los datos nuevos en el repositorio
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/precios.csv
          if ! git diff --cached --quiet; then
            git commit -m "Actualiza precios (automático)"
            git push
          fi
