# Configuración de despliegue en Render (Blueprint).
# Render lee este archivo y crea el servicio web de LuzPredict.
services:
  - type: web
    name: luzpredict
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:server --bind 0.0.0.0:$PORT
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
